name: Fork release

# Builds macOS on a "*-bluejanis-<date>[-<hhmm>]" tag and publishes the Zero Hour zip as a release.
# The Windows zip is built locally and added with "gh release upload".
on:
  push:
    tags:
      - "*-bluejanis-*"

permissions:
  contents: write
  pull-requests: read # requested by build-macos.yml

jobs:
  macos:
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  release:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      - name: Download Zero Hour builds
        uses: actions/download-artifact@v4
        with:
          pattern: "*-*GeneralsXZH.zip"
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${GITHUB_REF_NAME}" dist/*GeneralsXZH.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "GeneralsX ${GITHUB_REF_NAME}" \
            --notes-file .github/fork-release-notes.md
